name: internal-https
services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: internal-https
    user: "1001:1001"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # The official Caddy binary carries this file capability; keeping it in
    # the bounding set is required to execute that binary as a non-root user.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
